name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit and component tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Outer Control engine tests (real engine code against a fake database and a scripted tool)
        run: npm run test:engine

  functions:
    name: Edge functions (Deno tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Backend tests (supabase/functions/**/*_test.ts)
        run: ./supabase/functions/run-tests.sh
